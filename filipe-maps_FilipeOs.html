<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live360 - Câmara</title>
    <style>
        /* Reseta o documento para ocupar o ecrã inteiro de forma limpa */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .camera-viewport {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* O vídeo preenche todo o ecrã sem distorcer as proporções */
        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efeito espelho para a câmara frontal */
        }

        /* Interface sobreposta ao vídeo */
        .interface-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: none; /* Garante que cliques passam para os botões */
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .badge-live {
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ponto-rec {
            width: 8px;
            height: 8px;
            background-color: #ff3b30; /* Vermelho de gravação/live */
            border-radius: 50%;
            animation: piscar 1s infinite alternate;
        }

        @keyframes piscar {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        .btn-toggle {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s;
        }

        .btn-toggle:active {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="camera-viewport">
        <!-- Feed de vídeo nativo -->
        <video id="video-feed" autoplay playsinline muted></video>

        <!-- Elementos Visuais por cima da câmara -->
        <div class="interface-overlay">
            <div class="topo">
                <div class="badge-live">
                    <div class="ponto-rec"></div>
                    <span>LIVE 360</span>
                </div>
                <!-- Botão para alternar a câmara no telemóvel -->
                <button class="btn-toggle" id="btn-rodar" title="Mudar Câmara">🔄</button>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video-feed');
        const btnRodar = document.getElementById('btn-rodar');
        
        let streamAtivo = null;
        let modoCamera = "user"; // "user" = frontal/selfie, "environment" = traseira

        function ligarCamara(modo) {
            // Fecha a câmara anterior se estiver aberta para libertar o hardware
            if (streamAtivo) {
                streamAtivo.getTracks().forEach(track => track.stop());
            }

            // Inverte o espelho horizontal apenas na câmara frontal (selfie)
            videoElement.style.transform = (modo === "user") ? "scaleX(-1)" : "scaleX(1)";

            const opcoes = {
                video: { 
                    facingMode: modo,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false // Mantém em silêncio para evitar eco/feedback
            };

            navigator.mediaDevices.getUserMedia(opcoes)
                .then(stream => {
                    streamAtivo = stream;
                    videoElement.srcObject = stream;
                })
                .catch(erro => {
                    console.error("Erro de acesso à câmara:", erro);
                    alert("Acesso negado. Ativa a permissão de câmara nas definições do teu navegador.");
                });
        }

        // Alterna entre as câmaras ao clicar no ícone 🔄
        btnRodar.addEventListener('click', () => {
            modoCamera = (modoCamera === "user") ? "environment" : "user";
            ligarCamara(modoCamera);
        });

        // Inicializa a câmara imediatamente
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            ligarCamara(modoCamera);
        } else {
            alert("O teu navegador ou dispositivo não suporta o acesso direto à câmara via HTML5.");
        }
    </script>

</body>
</html>
